name: CI

on:
  push:
    branches: [main]
  # Not restricted to `main` — stacked PRs target another branch and must still
  # run CI before they are merged down the chain.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, format, types, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Lint markdown
        run: npm run lint:md

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.x is gone: vitest 5, tsup 9, markdownlint 0.50 and React Native 0.88 all
        # declare Node >= 22, so `npm ci` refuses the lockfile there.
        node-version: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Test
        run: npm test

  package:
    name: build, smoke, exports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build

      # The bundle cannot be imported outside Metro, so the smoke test checks the
      # shipped bytes instead: no secret, no injected script, no user-agent override,
      # and the wallet settings still present. Each of those fails silently on a phone.
      - name: Smoke-test the built package
        run: npm run smoke

      - name: Validate package metadata
        run: npm run check:exports
